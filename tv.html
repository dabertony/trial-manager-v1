<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <title>Trial Manager TV</title>

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1">

  <link rel="stylesheet" href="style.css?v=1">

  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #111827;

    }


    #tv {

      width: 100%;
      height: 100%;

      overflow: hidden;

      position: relative;

    }


    .tv-page {

  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  box-sizing: border-box;

  background: white;

  overflow: hidden;

  padding: 15px;

  display: none;

}


/*
 * Les gros classements peuvent défiler
 * verticalement lorsqu'ils dépassent
 * le nombre de pilotes prévu pour un
 * affichage fixe.
 */

.tv-page.tv-scroll {

  overflow-y: auto;

  overflow-x: hidden;

  scrollbar-width: none;

}

.tv-page.tv-scroll::-webkit-scrollbar {

  display: none;

}


    .tv-page.active {

      display: block;

    }


    /*
     * Pas d'interface Trial Manager
     * sur l'écran public.
     */

    .topbar,
    .topbar * {

      display: none !important;

    }


    /*
     * Pas de boutons sur la TV.
     */

    button {

      display: none !important;

    }


    /*
     * Écran d'attente.
     */

    .tv-waiting {

      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      color: white;

      font-size: 32px;

      font-weight: bold;

    }

  </style>

</head>


<body>

<div id="tv">

  <div class="tv-waiting">

    📺 En attente du classement...

  </div>

</div>


<script>

/* =====================================================
   ÉTAT TV
   ===================================================== */


/*
 * Version actuellement diffusée.
 */

let tvPages = [];


/*
 * Page actuellement affichée.
 */

let tvCurrentPage = 0;


/*
 * Nouvelle version reçue pendant
 * qu'un cycle est en cours.
 *
 * Elle remplace toujours la précédente.
 */

let pendingPages = null;


/*
 * Timer de changement de page.
 */

let tvTimer = null;

/*
 * Animation de défilement de la page TV.
 */

let tvScrollAnimation = null;


/*
 * Durée d'une page :
 * 7 secondes.
 */

const TV_PAGE_DURATION = 7000;


/*
 * Indique si un cycle est actuellement
 * en cours.
 */

let tvCycleRunning = false;


/* =====================================================
   EXTRACTION DES PAGES
   ===================================================== */

function extractTVPages(html){

  const temp =
    document.createElement("div");

  temp.innerHTML = html;


  return Array.from(
    temp.querySelectorAll(".print-page")
  );

}


/* =====================================================
   AFFICHAGE D'UNE PAGE
   ===================================================== */

function showTVPage(index){

  if(!tvPages.length){

    return;

  }


  /*
   * Arrête éventuellement le défilement
   * de la page précédente.
   */

  if(tvScrollAnimation){

    cancelAnimationFrame(tvScrollAnimation);

    tvScrollAnimation = null;

  }


  tvPages.forEach((page, i) => {

    page.classList.toggle(
      "active",
      i === index
    );

  });


  tvCurrentPage = index;


  const page = tvPages[index];

  if(!page){

    return;

  }


  /*
   * Retour en haut à chaque affichage.
   */

  page.scrollTop = 0;


  /*
   * Plus de 20 pilotes :
   * défilement automatique.
   */

  if(page.dataset.tvScroll === "true"){

    startTVScroll(page);

  }

}

function startTVScroll(page){

  const maxScroll =
    page.scrollHeight - page.clientHeight;


  /*
   * Sécurité :
   * si finalement tout tient,
   * aucun défilement.
   */

  if(maxScroll <= 0){

    return;

  }


  /*
   * Pause en haut avant de commencer.
   */

  setTimeout(() => {

    /*
     * La page n'est peut-être plus
     * celle affichée.
     */

    if(
      !page.classList.contains("active") ||
      tvPages[tvCurrentPage] !== page
    ){

      return;

    }


    const startTime =
      performance.now();

    const scrollDuration =
      Math.max(
        8000,
        (maxScroll / 40) * 1000
      );


    function animateScroll(now){

      if(
        !page.classList.contains("active") ||
        tvPages[tvCurrentPage] !== page
      ){

        return;

      }


      const elapsed =
        now - startTime;


      const progress =
        Math.min(
          elapsed / scrollDuration,
          1
        );


      /*
       * Défilement progressif et régulier.
       */

      page.scrollTop =
        maxScroll * progress;


      if(progress < 1){

        tvScrollAnimation =
          requestAnimationFrame(
            animateScroll
          );

        return;

      }


      tvScrollAnimation = null;


      /*
       * Petite pause en bas avant
       * de passer au classement suivant.
       */

      tvTimer = setTimeout(() => {

        tvCurrentPage++;


        if(
          tvCurrentPage >= tvPages.length
        ){

          finishTVCycle();

          return;

        }


        showTVPage(tvCurrentPage);

        scheduleNextTVPage();

      }, 3000);

    }


    tvScrollAnimation =
      requestAnimationFrame(
        animateScroll
      );

  }, 3000);

}


/* =====================================================
   CHARGEMENT D'UNE VERSION
   ===================================================== */

function loadTVVersion(pages){

  const tv =
    document.getElementById("tv");


  tv.innerHTML = "";


  tvPages = [];


  pages.forEach(page => {

  page.classList.add("tv-page");


  /*
   * Nombre de pilotes du tableau.
   * La première ligne est l'en-tête.
   */

  const table =
    page.querySelector("table");

  const pilotCount =
    table
      ? Math.max(
          0,
          table.querySelectorAll("tr").length - 1
        )
      : 0;


  /*
   * Jusqu'à 20 pilotes :
   * affichage fixe.
   *
   * Au-delà :
   * défilement automatique.
   */

  if(pilotCount > 20){

    page.classList.add("tv-scroll");

    page.dataset.tvScroll = "true";

  }else{

    page.dataset.tvScroll = "false";

  }


  tv.appendChild(page);

  tvPages.push(page);

});


  tvCurrentPage = 0;


  showTVPage(0);

}


/* =====================================================
   FIN DE CYCLE
   ===================================================== */

function finishTVCycle(){

  /*
   * Le cycle actuel est terminé.
   */

  tvCycleRunning = false;


  /*
   * Une nouvelle version attend ?
   */

  if(pendingPages){

    const newPages =
      pendingPages;


    /*
     * On vide la file d'attente.
     */

    pendingPages = null;


    /*
     * On charge uniquement maintenant
     * la nouvelle version.
     */

    loadTVVersion(newPages);

  }


  /*
   * Nouveau cycle.
   */

  tvCurrentPage = 0;

  tvCycleRunning = true;


  scheduleNextTVPage();

}


/* =====================================================
   PAGE SUIVANTE
   ===================================================== */

function scheduleNextTVPage(){

  if(tvTimer){

    clearTimeout(tvTimer);

  }


  const currentPage =
    tvPages[tvCurrentPage];


  /*
   * Les gros tableaux gèrent eux-mêmes
   * leur durée via le défilement.
   */

  if(
    currentPage &&
    currentPage.dataset.tvScroll === "true"
  ){

    return;

  }


  /*
   * Tableau normal :
   * 7 secondes d'affichage.
   */

  tvTimer = setTimeout(() => {

    /*
     * S'il n'y a qu'une seule page,
     * on boucle simplement dessus.
     */

    if(tvPages.length <= 1){

      finishTVCycle();

      return;

    }


    tvCurrentPage++;


    /*
     * Fin du cycle.
     */

    if(tvCurrentPage >= tvPages.length){

      finishTVCycle();

      return;

    }


    showTVPage(tvCurrentPage);


    /*
     * On programme la page suivante.
     */

    scheduleNextTVPage();

  }, TV_PAGE_DURATION);

}

/* =====================================================
   DÉMARRAGE
   ===================================================== */

function startTVCycle(){

  if(!tvPages.length){

    return;

  }


  if(tvTimer){

    clearTimeout(tvTimer);

  }


  tvCurrentPage = 0;

  tvCycleRunning = true;

  showTVPage(0);

  scheduleNextTVPage();

}


/* =====================================================
   RÉCEPTION D'UN CLASSEMENT
   ===================================================== */

window.api.onTVContent((html) => {

  const pages =
    extractTVPages(html);


  if(!pages.length){

    return;

  }


  /*
   * PREMIÈRE VERSION
   *
   * La TV n'a encore rien à afficher.
   */

  if(!tvPages.length){

    loadTVVersion(pages);

    startTVCycle();

    return;

  }


  /*
   * Une version est déjà diffusée.
   *
   * On NE TOUCHE PAS à l'affichage actuel.
   *
   * On remplace simplement la version
   * en attente par la dernière reçue.
   */

  pendingPages = pages;

});

</script>

</body>

</html>
